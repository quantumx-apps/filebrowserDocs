server:
  port: 80
  baseURL: "/files"
  internalUrl: "http://beta-large/files"
  externalUrl: "https://gportal.link/files"
  logging:
    - output: stdout
      levels: info,error,debug,warning
      apiLevels: disabled
    - output: data/api.log
      levels: disabled
      noColors: true
  cacheDir: data/tmp
  sources:
    - path: .
      name: "docker"
    - path: /storage
      config:
        rules:
          - folderPath: "/influxdb_data"
            viewable: true
          - folderPath: "/prometheus_data"
            viewable: true
auth:
  adminPassword: "mysecurepassword"
  methods:
    oidc:
      enabled: false
userDefaults:
  showHidden: true
  singleClick: false
  darkMode: true
  permissions:
    admin: false
    modify: true
    share: true
frontend:
  favicon: "data/fav.png"
